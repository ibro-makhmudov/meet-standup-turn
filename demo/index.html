<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fake Meet call</title>
  <style>
    body { margin: 0; background: #202124; color: #e8eaed; font: 14px Roboto, Arial, sans-serif; height: 100vh; }
    .people { position: absolute; transition: opacity .1s; right: 16px; top: 16px; width: 330px; background: #202124; border: 1px solid #3c4043; border-radius: 16px; padding: 12px; display: none; }
    .people.open { display: block; }
    .sect { border: 1px solid #5f6368; border-radius: 12px; }
    .sect .h { padding: 12px 16px; border-bottom: 1px solid #5f6368; display: flex; justify-content: space-between; }
    [role=listitem] { padding: 8px 12px 8px 24px; display: flex; align-items: center; gap: 12px; }
    .av { width: 32px; height: 32px; border-radius: 50%; background: #5f6368; display: grid; place-items: center; }
    .nm { flex: 1; }
    [role=listitem] button { background: none; border: 0; color: #9aa0a6; cursor: pointer; }
    .ctl { margin-top: 10px; display: flex; gap: 6px; }
    .ctl input { flex: 1; }
    .toolbar { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); }
    .toolbar button, .toolbar [role=button] { display: inline-block; background: #3c4043; color: #e8eaed; border: 0; border-radius: 20px; padding: 10px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Mimics Meet's People panel: listitems with aria-label = display name, "You" first, then alphabetical. -->
  <aside class="people" id="panel">
    <div class="sect">
      <div class="h"><span>Contributors</span><span id="cnt"></span></div>
      <div role="list" aria-label="Participants" id="list"></div>
    </div>
    <div class="ctl"><input id="nm" placeholder="name"><button id="join">join</button></div>
  </aside>
  <div class="toolbar"><div role="button" tabindex="0" aria-labelledby="plbl" id="pbtn"></div><span id="plbl" hidden>People</span>
    <button aria-label="Chat with everyone" id="cbtn">Chat</button></div>
  <aside id="chat" class="people" aria-label="Side panel"><textarea placeholder="Send a message"></textarea></aside>
  <script>
    const params = new URLSearchParams(location.search);
    globalThis.STANDUP_DEMO = true;
    if (params.has('reset')) localStorage.clear();
    if (params.get('starter')) localStorage.setItem('meet:demo', JSON.stringify({ known: [], last: { date: params.get('date'), starter: params.get('starter') } }));
    if (params.has('open')) panel.classList.add('open');
    if (params.has('clean')) document.head.insertAdjacentHTML('beforeend', '<style>.ctl, [role=listitem] button { display: none !important; } .toolbar { opacity: 0; }</style>');
    // like Meet: the list is rendered on first open (?lazy=1) and stays in the page when closed
    let rendered = !params.has('lazy');
    pbtn.onclick = () => setTimeout(() => { chat.classList.remove('open'); panel.classList.toggle('open'); if (!rendered) { rendered = true; draw(); } }, 200);
    cbtn.onclick = () => { panel.classList.remove('open'); chat.classList.toggle('open'); };
    if (params.has('chat')) chat.classList.add('open');
    const self = params.get('self') || 'Imre Fekete';
    let people = (params.get('people') || 'Ádám Kovács,Anna Tóth,Balázs Nagy,Dávid Szabó,David Varga,Krisztina Hegedűs,Lili Simon,Márk Molnár,Nóra Pap,Péter Lakatos,Zoltán Fehér').split(',');
    // Meet-like re-render: rebuilds all rows whenever someone joins or leaves
    // ?merged=A,B puts those people under a "Merged audio" group row, like Meet's companion devices
    const merged = (params.get('merged') || '').split(',').filter(Boolean);
    const row = (p) => `<div role="listitem" aria-label="${p}"><span class="av">${p[0]}</span><span class="nm">${p}</span><button data-p="${p}">leave</button></div>`;
    const draw = () => {
      const sorted = [...people].sort((a, b) => a.localeCompare(b, 'en'));
      const group = sorted.filter((p) => merged.includes(p));
      if (!rendered) { list.innerHTML = ''; pbtn.textContent = '👥 ' + (people.length + 1); return; }
      list.innerHTML = [`<div role="listitem" aria-label="${self}"><span class="av">I</span><span class="nm">${self} (You)</span></div>`]
        .concat(group.length ? [`<div role="listitem" aria-label="Merged audio" style="display:block"><div style="padding:8px 0">Merged audio</div>${group.map(row).join('')}</div>`] : [])
        .concat(sorted.filter((p) => !merged.includes(p)).map(row)).join('');
      cnt.textContent = sorted.length + 1;
      pbtn.textContent = '👥 ' + (sorted.length + 1);
    };
    list.onclick = (e) => { if (e.target.dataset.p) { people = people.filter((p) => p !== e.target.dataset.p); draw(); } };
    join.onclick = () => { if (nm.value) { people.push(nm.value); nm.value = ''; draw(); } };
    draw();
  </script>
  <script>
    if (params.get('date')) globalThis.STANDUP_TODAY = params.get('date');
    // screenshot helpers: ?update=1.2.0 shows the update line, ?min=1 starts minimized, ?menu=1 opens the menu
    if (params.get('update')) globalThis.STANDUP_DEMO_UPDATE = params.get('update');
    localStorage.setItem('standup-min', params.has('min') ? '1' : '0');
    if (params.has('menu')) setTimeout(() => document.getElementById('standup-turn-root').shadowRoot.querySelector('[data-a=menu]').click(), 2500);
  </script>
  <script src="../rotation.js"></script>
  <script src="../content.js"></script>
</body>
</html>
